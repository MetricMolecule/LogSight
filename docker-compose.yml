services:

  postgres:
    image: postgres:16
    container_name: logsight-postgres

    environment:
      POSTGRES_USER: logsight
      POSTGRES_PASSWORD: logsight
      POSTGRES_DB: logsight

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logsight -d logsight"]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7-alpine
    container_name: logsight-redis

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10


  api:
    build: .

    container_name: logsight-api

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+psycopg://logsight:logsight@postgres:5432/logsight
      REDIS_URL: redis://redis:6379/0

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]


  worker:
    build: .

    container_name: logsight-worker

    environment:
      DATABASE_URL: postgresql+psycopg://logsight:logsight@postgres:5432/logsight
      REDIS_URL: redis://redis:6379/0

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    command:
      [
        "python",
        "-m",
        "app.workers.consumer"
      ]


volumes:
  postgres_data: