services:
  - type: web
    name: logsight-web
    runtime: docker
    region: singapore
    healthCheckPath: /health

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: logsight-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          name: logsight-redis
          type: keyvalue
          property: connectionString

  - type: worker
    name: logsight-worker
    runtime: docker
    region: singapore

    dockerCommand: python -m app.workers.consumer

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: logsight-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          name: logsight-redis
          type: keyvalue
          property: connectionString

  - type: keyvalue
    name: logsight-redis
    region: singapore

    ipAllowList: []

databases:
  - name: logsight-db
    region: singapore
    databaseName: logsight
