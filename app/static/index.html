<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LogSight Dashboard</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

    <header class="header">

        <div>
            <h1>LogSight</h1>
            <p>Real-time application log monitoring</p>
        </div>

        <div class="connection">
            <span id="connectionDot"></span>
            <span id="connectionStatus">
                Connecting...
            </span>
        </div>

    </header>


    <!-- SUMMARY -->

    <section class="cards">

        <div class="card">
            <h3>Total Logs</h3>
            <h1 id="totalLogs">0</h1>
        </div>

        <div class="card">
            <h3>Errors</h3>
            <h1 id="errorLogs">0</h1>
        </div>

        <div class="card">
            <h3>Warnings</h3>
            <h1 id="warningLogs">0</h1>
        </div>

        <div class="card">
            <h3>Services</h3>
            <h1 id="services">0</h1>
        </div>

    </section>


    <!-- FILTERS -->

    <section class="filters">

        <input id="search" type="text" placeholder="Search message, request ID or user ID">

        <select id="serviceFilter">
            <option value="">
                All Services
            </option>
        </select>

        <select id="levelFilter">
            <option value="">
                All Levels
            </option>
        </select>

        <label>
            From
            <input id="startTime" type="datetime-local">
        </label>

        <label>
            To
            <input id="endTime" type="datetime-local">
        </label>

        <button id="applyFilters">
            Apply
        </button>

        <button id="clearFilters" class="secondary">
            Clear
        </button>

        <button id="exportLogs" class="export">
            Export CSV
        </button>

    </section>


    <!-- LIVE CONTROL -->

    <section class="toolbar">

        <label class="live-toggle">

            <input id="liveUpdates" type="checkbox" checked>

            Live updates

        </label>

        <span id="resultCount">
            0 logs
        </span>

    </section>


    <!-- CHARTS -->

    <section class="charts-grid">

        <div class="chart-card">

            <h3>Logs by Level</h3>

            <canvas id="levelsChart"></canvas>

        </div>


        <div class="chart-card">

            <h3>Logs by Service</h3>

            <canvas id="servicesChart"></canvas>

        </div>


        <div class="chart-card full-width">

            <h3>Logs Per Hour</h3>

            <canvas id="hourlyChart"></canvas>

        </div>

    </section>


    <!-- LOG TABLE -->

    <section class="table-card">

        <div id="emptyState" class="empty-state">
            No logs found.
        </div>

        <table id="logsTable">

            <thead>

                <tr>

                    <th>Timestamp</th>

                    <th>Service</th>

                    <th>Level</th>

                    <th>Message</th>

                </tr>

            </thead>

            <tbody></tbody>

        </table>

    </section>


    <!-- PAGINATION -->

    <section class="pagination">

        <button id="previousPage">
            Previous
        </button>

        <span id="pageInfo">
            Page 1
        </span>

        <button id="nextPage">
            Next
        </button>

    </section>


    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="/static/app.js"></script>

</body>

</html>
